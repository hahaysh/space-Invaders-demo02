name: Check and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit --registry=https://registry.npmjs.org
      - name: Prepare Chromium and system dependencies
        run: npm run browser:install -- --with-deps
      - name: Check model rules
        run: npm test
      - name: Check browser input and rendering
        shell: bash
        run: |
          # Keep npm and Vite in one owned process group for cleanup.
          setsid npm run dev > "$RUNNER_TEMP/space-defense-dev.log" 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 -- "-$server_pid" 2>/dev/null; then
              kill -- "-$server_pid"
            fi
            cat "$RUNNER_TEMP/space-defense-dev.log"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --retry-max-time 30 --max-time 5 \
            http://127.0.0.1:5173/ > /dev/null
          kill -0 "$server_pid"
          npm run test:e2e
      - name: Build static site
        run: npm run build
      - name: Upload verified Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
