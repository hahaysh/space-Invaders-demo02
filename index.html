<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우주 방어</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SPACE DEFENSE · M1</p>
        <h1>우주 방어</h1>
        <p id="controls">이동: ← → 또는 A / D · 발사: Space 길게 누르기</p>
      </header>
      <section class="game" aria-label="우주 방어 게임">
        <canvas id="game" width="800" height="600" tabindex="-1"
          aria-label="우주선과 탄환이 표시되는 게임 화면" aria-describedby="controls status">
          Canvas를 지원하는 데스크톱 브라우저에서 실행해 주세요.
        </canvas>
        <div id="title-screen" class="overlay">
          <h2>출격 준비</h2>
          <p>우주선을 움직이고 위로 발사해 보세요.</p>
          <button id="start" type="button">게임 시작</button>
          <p class="hint">Enter로도 시작할 수 있습니다.</p>
        </div>
      </section>
      <p id="status" role="status">시작 대기</p>
      <p class="hint">첫 구현 단계입니다. 적·점수·승패는 아직 없습니다.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
